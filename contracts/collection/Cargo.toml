[package]
name = "agent-nft-collection"
version = "0.1.0"
edition = "2021"
description = "NEP-171 collection where every token is a NEAR sub-account wallet"
repository = "https://github.com/OWNER/near-agent-nft"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"
near-contract-standards = "5.30.0"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
