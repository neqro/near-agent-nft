[package]
name = "agent-nft-wallet"
version = "0.1.0"
edition = "2021"
description = "Keyless per-token wallet; obeys whoever currently owns the NFT"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30.0"

[dev-dependencies]
near-sdk = { version = "5.30.0", features = ["unit-testing"] }
